<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Fixer Pro - 红色法线修复工具</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: rgba(20, 20, 25, 0.7);
            --primary: #ff3e3e;
            --secondary: #00f2ff;
            --text: #e0e0e0;
            --text-dim: #909090;
            --accent-glow: rgba(255, 62, 62, 0.2);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 62, 62, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 255, 0.05) 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
        }
        .container { max-width: 1000px; width: 100%; }
        header { text-align: center; margin-bottom: 40px; }
        h1 {
            font-size: 2.5rem; font-weight: 800; letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;
        }
        .subtitle { color: var(--text-dim); font-size: 1rem; }
        .main-card {
            background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .upload-zone {
            border: 2px dashed var(--glass-border); border-radius: 16px; padding: 40px; text-align: center;
            transition: all 0.3s ease; cursor: pointer; margin-bottom: 30px;
        }
        .upload-zone:hover { border-color: var(--primary); background: rgba(255, 62, 62, 0.02); }
        .upload-zone.dragging { border-color: var(--secondary); background: rgba(0, 242, 255, 0.05); transform: scale(1.01); }
        .upload-icon { font-size: 48px; margin-bottom: 15px; display: block; }
        .controls { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        .switch-group { display: flex; background: rgba(0, 0, 0, 0.3); padding: 4px; border-radius: 12px; border: 1px solid var(--glass-border); }
        .switch-btn { padding: 10px 24px; border-radius: 8px; border: none; background: transparent; color: var(--text-dim); font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .switch-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--accent-glow); }
        .switch-btn.dx.active { background: var(--secondary); box-shadow: 0 4px 12px rgba(0, 242, 255, 0.2); }
        
        select { background: transparent; color: white; border: none; padding: 0 10px; font-weight: 600; cursor: pointer; outline: none; appearance: none; }
        option { background: #1a1a1a; }

        .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 768px) { .preview-grid { grid-template-columns: 1fr; } }
        .preview-box { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 1; border: 1px solid var(--glass-border); }
        .preview-box canvas { width: 100%; height: 100%; object-fit: contain; }
        .label { position: absolute; top: 12px; left: 12px; background: rgba(0, 0, 0, 0.6); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; z-index: 2; }
        .export-btn {
            display: block; width: 100%; padding: 16px; border-radius: 12px; border: none;
            background: linear-gradient(90deg, var(--primary), #ff6b6b); color: white;
            font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; margin-top: 30px;
        }
        .export-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 62, 62, 0.3); }
        .export-btn:disabled { background: #333; cursor: not-allowed; transform: none; box-shadow: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Normal Fixer Pro</h1>
            <p class="subtitle">自动重组 Unity 红色贴图 (R=A, G=B) 并转换 OpenGL/DirectX</p>
        </header>

        <main class="main-card">
            <div class="upload-zone" id="dropZone">
                <span class="upload-icon">📁</span>
                <p>点击或拖拽 "红色贴图" 到这里</p>
                <input type="file" id="fileInput" hidden accept="image/*">
            </div>

            <div class="controls">
                <div class="switch-group">
                    <button class="switch-btn active" id="btnGL">OpenGL (Y+)</button>
                    <button class="switch-btn" id="btnDX">DirectX (Y-)</button>
                </div>
                <div class="switch-group">
                    <select id="exportFormat">
                        <option value="PNG">PNG</option>
                        <option value="TGA">TGA</option>
                    </select>
                </div>
            </div>

            <div class="preview-grid">
                <div class="preview-box">
                    <div class="label">输入贴图</div>
                    <canvas id="canvasInput"></canvas>
                </div>
                <div class="preview-box">
                    <div class="label" id="outputLabel">修复后 (OpenGL)</div>
                    <canvas id="canvasOutput"></canvas>
                </div>
            </div>

            <button class="export-btn" id="exportBtn" disabled>导出修复后的贴图</button>
        </main>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const canvasInput = document.getElementById('canvasInput');
        const canvasOutput = document.getElementById('canvasOutput');
        const btnGL = document.getElementById('btnGL');
        const btnDX = document.getElementById('btnDX');
        const exportBtn = document.getElementById('exportBtn');
        const outputLabel = document.getElementById('outputLabel');
        const exportFormat = document.getElementById('exportFormat');

        let originalImage = null;
        let currentFormat = 'GL';

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragging'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragging'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragging');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        btnGL.addEventListener('click', () => setFormat('GL'));
        btnDX.addEventListener('click', () => setFormat('DX'));
        exportBtn.addEventListener('click', () => {
            const format = exportFormat.value;
            const fileName = `Fixed_Normal_${currentFormat}.${format.toLowerCase()}`;
            
            if (format === 'PNG') {
                const link = document.createElement('a');
                link.download = fileName;
                link.href = canvasOutput.toDataURL('image/png');
                link.click();
            } else if (format === 'TGA') {
                const tgaData = encodeTGA(canvasOutput);
                const blob = new Blob([tgaData], { type: 'image/x-tga' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = fileName;
                link.href = url;
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }
        });

        function setFormat(format) {
            currentFormat = format;
            if (format === 'GL') {
                btnGL.classList.add('active'); btnDX.classList.remove('active');
                outputLabel.textContent = '修复后 (OpenGL)';
            } else {
                btnDX.classList.add('active'); btnGL.classList.remove('active');
                outputLabel.textContent = '修复后 (DirectX)';
            }
            if (originalImage) processImage();
        }

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    canvasInput.width = canvasOutput.width = img.width;
                    canvasInput.height = canvasOutput.height = img.height;
                    canvasInput.getContext('2d').drawImage(img, 0, 0);
                    processImage();
                    exportBtn.disabled = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processImage() {
            const ctxIn = canvasInput.getContext('2d');
            const ctxOut = canvasOutput.getContext('2d');
            const imgData = ctxIn.getImageData(0, 0, canvasInput.width, canvasInput.height);
            const data = imgData.data;
            const output = ctxOut.createImageData(canvasInput.width, canvasInput.height);
            const out = output.data;

            for (let i = 0; i < data.length; i += 4) {
                const nx = data[i + 3] / 255.0; // Alpha -> X
                const ny = data[i + 1] / 255.0; // Green -> Y
                let vx = nx * 2.0 - 1.0;
                let vy = ny * 2.0 - 1.0;
                if (currentFormat === 'DX') vy = -vy;
                const vz = 1.0;
                const len = Math.sqrt(vx * vx + vy * vy + vz * vz);
                out[i] = ((vx / len) * 0.5 + 0.5) * 255;
                out[i + 1] = ((vy / len) * 0.5 + 0.5) * 255;
                out[i + 2] = ((vz / len) * 0.5 + 0.5) * 255;
                out[i + 3] = 255;
            }
            ctxOut.putImageData(output, 0, 0);
        }

        function encodeTGA(canvas) {
            const ctx = canvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imgData.data;
            const width = canvas.width;
            const height = canvas.height;

            const header = new Uint8Array(18);
            header[2] = 2; // Truecolor
            header[12] = width & 0xFF; header[13] = (width >> 8) & 0xFF;
            header[14] = height & 0xFF; header[15] = (height >> 8) & 0xFF;
            header[16] = 32; // 32-bit (RGBA)
            header[17] = 0x20; // Top-to-bottom

            const tgaData = new Uint8Array(18 + width * height * 4);
            tgaData.set(header);
            let offset = 18;
            for (let i = 0; i < pixels.length; i += 4) {
                tgaData[offset++] = pixels[i + 2]; // B
                tgaData[offset++] = pixels[i + 1]; // G
                tgaData[offset++] = pixels[i];     // R
                tgaData[offset++] = pixels[i + 3]; // A
            }
            return tgaData;
        }
    </script>
</body>
</html>
